      <button id="retry" class="retry" type="button" hidden>重新读取目录</button>
    </aside>
    <section id="exhibition" class="panel stage" aria-labelledby="stage-title" tabindex="-1">
      <header class="stage-header"><h2 id="stage-title">3D 展台</h2><p id="selected-name" class="selected-name" aria-live="polite">尚未选择</p></header>
      <div id="stage" class="stage-live" aria-label="油纸伞三维展示" aria-busy="true"></div>
      <div class="exhibit-toolbar">
        <button id="mobile-controls-toggle" class="mobile-controls-toggle" type="button" aria-expanded="true" aria-controls="exhibit-controls">收起控制</button>
        <fieldset id="exhibit-controls" disabled>
          <label for="exhibit-open">开合 <output id="exhibit-open-value">100%</output><input id="exhibit-open" type="range" min="0" max="1" step="0.01" value="1"></label>
          <label for="exhibit-pattern">纹样<select id="exhibit-pattern"></select></label>
          <label class="rotation-label"><input id="exhibit-rotation" type="checkbox" checked> 缓慢自转</label>
        </fieldset>
        <p id="exhibit-status" role="status" aria-live="polite">正在载入三维展台…</p>
        <button id="exhibit-retry" type="button" hidden>重新载入模型</button>
        <button id="page-retry" type="button" hidden>重新加载页面</button>
        <p id="exhibit-help" class="exhibit-hint">鼠标拖动旋转 · 滚轮缩放 · 操作后稍停再恢复自转。键盘聚焦展台后：方向键旋转，+ / - 缩放。</p>
      </div>
    </section>
    <section id="culture" class="panel culture" aria-labelledby="culture-title">
      <div class="section-heading"><h2 id="culture-title">文化解说</h2><span id="culture-record" class="count">尚未选择</span></div>
      <div class="culture-tabs" role="tablist" aria-label="文化解说分类">
        <button id="tab-form" type="button" role="tab" aria-selected="true" aria-controls="panel-form" tabindex="0">形制</button>
        <button id="tab-craft" type="button" role="tab" aria-selected="false" aria-controls="panel-craft" tabindex="-1">工艺</button>
        <button id="tab-pattern" type="button" role="tab" aria-selected="false" aria-controls="panel-pattern" tabindex="-1">纹样</button>
      </div>
      <div id="panel-form" class="culture-panel" role="tabpanel" aria-labelledby="tab-form" tabindex="0"><p>暂无资料</p></div>
      <div id="panel-craft" class="culture-panel" role="tabpanel" aria-labelledby="tab-craft" tabindex="0" hidden><p>暂无资料</p></div>
      <div id="panel-pattern" class="culture-panel" role="tabpanel" aria-labelledby="tab-pattern" tabindex="0" hidden><p>暂无资料</p></div>
    </section>
  </main>
  <script>
    (() => {
      const reload = document.querySelector('#page-retry');
      reload.addEventListener('click', () => location.reload());
      function failed() {
        document.querySelector('#catalog-status').textContent = '页面初始化失败或超时，请检查网络后重新加载。';
        document.querySelector('#catalog-status').dataset.error = 'true';
        document.querySelector('#umbrella-list').setAttribute('aria-busy', 'false');
        document.querySelector('#exhibit-status').textContent = '页面组件未能完整载入。请检查网络后重新加载页面。';
        document.querySelector('#exhibit-status').dataset.error = 'true';
        document.querySelector('#stage').setAttribute('aria-busy', 'false');
        reload.hidden = false;
      }
      const deadline = setTimeout(failed, 12000);
      Promise.all([import('./src/app.js'), import('./src/mobile-layout.js')])
        .then(() => {
          clearTimeout(deadline);
          if (document.querySelector('#catalog-status').dataset.error !== 'true'
              && document.querySelector('#exhibit-status').dataset.error !== 'true') reload.hidden = true;
        })
        .catch(() => { clearTimeout(deadline); failed(); });
    })();
  </script>
</body>
</html>
